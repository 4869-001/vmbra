<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="anywhere-token" content="__ANYWHERE_TOKEN__" />
<title>AnyWhere WorkStation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Cpath d='M10 22V10l12 12V10' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/vendor/xterm/xterm.css" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><path d="M9 23V9l14 14V9" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">AnyWhere</span>
        <span class="brand-sub">WorkStation</span>
      </div>
    </div>

    <div class="ws-picker">
      <label for="ws-select">工作站</label>
      <div class="select-wrap">
        <select id="ws-select"><option>workstation</option></select>
        <svg class="chev" viewBox="0 0 16 16" width="12" height="12"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <span class="dot" id="link-dot"></span>
      <span id="link-text">连接中…</span>
      <button class="icon-btn ghost" id="btn-reconnect" title="重新连接">
        <svg viewBox="0 0 20 20" width="15" height="15"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="page-head">
      <h1 id="page-title">工作站</h1>
      <div class="head-actions">
        <button class="icon-btn" id="btn-refresh" title="刷新">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>
    <div class="view" id="view">
      <div class="loading-row"><span class="spinner"></span> 正在加载…</div>
    </div>
  </main>
</div>

<div id="toasts" class="toasts"></div>
<div id="modal-root"></div>

<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/xterm/addon-fit.js"></script>
<script src="/app.js"></script>
<script src="/views-import.js"></script>
<script src="/views-workstation.js"></script>
<script src="/views-files.js"></script>
<script src="/views-apps.js"></script>
<script src="/views-network.js"></script>
<script src="/views-env.js"></script>
<script src="/views-maintenance.js"></script>
<script src="/views-tasks.js"></script>
<script src="/views-diagnostics.js"></script>
<script src="/views-settings.js"></script>
<script src="/boot.js"></script>
</body>
</html>
